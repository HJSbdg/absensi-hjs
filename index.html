<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Absensi Personel HJS - MBU Bojong Soang</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
  </style>
</head>
<body class="bg-slate-100 min-h-screen flex flex-col justify-between text-slate-800">

  <!-- Header -->
  <header class="bg-gradient-to-r from-blue-900 to-indigo-900 text-white shadow-md">
    <div class="max-w-md mx-auto px-5 py-5 text-center">
      <div class="inline-block bg-blue-800/70 border border-blue-400/30 text-blue-100 text-[11px] font-bold tracking-wider uppercase px-3 py-1 rounded-full mb-2">
        PT Hasna Jaya Sejahtera
      </div>
      <h1 class="text-xl font-extrabold tracking-tight">ABSENSI PERSONEL HJS</h1>
      <p class="text-blue-200 text-xs mt-0.5">Penempatan: MBU Bojong Soang</p>
      
      <!-- Jam Live -->
      <div class="mt-4 bg-white/10 backdrop-blur-sm border border-white/15 rounded-xl py-2.5 px-4">
        <div id="liveDate" class="text-xs text-blue-100 font-medium">Memuat tanggal...</div>
        <div id="liveClock" class="text-2xl font-extrabold tracking-wider mt-0.5 font-mono">00:00:00</div>
      </div>
    </div>
  </header>

  <!-- Main Card -->
  <main class="max-w-md w-full mx-auto px-4 py-6 flex-1">
    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-5 space-y-5">
      
      <!-- Status Koneksi -->
      <div id="syncBadge" class="flex items-center justify-between bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2 text-xs">
        <span class="text-slate-600 font-medium" id="syncText">Memuat daftar personel...</span>
        <button onclick="loadPersonel()" class="text-blue-600 font-semibold hover:underline">Refresh</button>
      </div>

      <!-- Pilih Nama -->
      <div>
        <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1.5">1. Pilih Nama Anda</label>
        <select id="selectNama" class="w-full bg-slate-50 border border-slate-300 text-slate-800 text-sm font-semibold rounded-xl px-3.5 py-3 focus:ring-2 focus:ring-blue-600 focus:border-blue-600 outline-none">
          <option value="">-- Sedang memuat nama... --</option>
        </select>
      </div>

      <!-- Pilih Shift -->
      <div>
        <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1.5">2. Pilih Shift Kerja</label>
        <div class="grid grid-cols-3 gap-2.5">
          <button type="button" onclick="pilihShift('Shift 1')" id="btnShift1" class="shift-btn py-2.5 px-2 rounded-xl border-2 border-slate-200 text-sm font-bold text-slate-600 hover:border-blue-500 transition">
            Shift 1
          </button>
          <button type="button" onclick="pilihShift('Shift 2')" id="btnShift2" class="shift-btn py-2.5 px-2 rounded-xl border-2 border-slate-200 text-sm font-bold text-slate-600 hover:border-blue-500 transition">
            Shift 2
          </button>
          <button type="button" onclick="pilihShift('Shift 3')" id="btnShift3" class="shift-btn py-2.5 px-2 rounded-xl border-2 border-slate-200 text-sm font-bold text-slate-600 hover:border-blue-500 transition">
            Shift 3
          </button>
        </div>
        <input type="hidden" id="selectedShift" value="">
      </div>

      <!-- Opsi Jam Manual (Opsional jika telat klik) -->
      <div class="bg-slate-50 border border-slate-200 rounded-xl p-3">
        <div class="flex items-center justify-between">
          <span class="text-xs font-semibold text-slate-600">Jam Tercatat:</span>
          <label class="inline-flex items-center gap-1.5 text-xs text-blue-700 font-medium cursor-pointer">
            <input type="checkbox" id="toggleManualTime" onchange="toggleTimeInput()" class="rounded text-blue-600">
            Ubah jam manual
          </label>
        </div>
        <input type="time" id="inputJam" readonly class="mt-1.5 w-full bg-white border border-slate-300 rounded-lg px-3 py-2 text-base font-bold text-slate-800 font-mono">
      </div>

      <!-- Tombol Aksi Masuk & Pulang -->
      <div class="grid grid-cols-2 gap-3 pt-1">
        <button id="btnMasuk" onclick="kirimAbsen('MASUK')" class="bg-emerald-600 hover:bg-emerald-700 active:scale-[0.99] text-white font-bold py-3.5 px-4 rounded-xl shadow-sm transition flex flex-col items-center justify-center gap-0.5">
          <span class="text-sm">ABSEN MASUK</span>
          <span class="text-[11px] font-normal text-emerald-100">Mulai Kerja</span>
        </button>

        <button id="btnPulang" onclick="kirimAbsen('PULANG')" class="bg-amber-600 hover:bg-amber-700 active:scale-[0.99] text-white font-bold py-3.5 px-4 rounded-xl shadow-sm transition flex flex-col items-center justify-center gap-0.5">
          <span class="text-sm">ABSEN PULANG</span>
          <span class="text-[11px] font-normal text-amber-100">Selesai Kerja</span>
        </button>
      </div>

      <!-- Notifikasi Hasil -->
      <div id="alertBox" class="hidden rounded-xl p-3.5 text-sm font-medium border"></div>

    </div>

    <!-- Riwayat Absen Hari Ini di HP -->
    <div class="mt-5 bg-white rounded-2xl shadow-sm border border-slate-200 p-4">
      <div class="flex items-center justify-between mb-2.5">
        <h2 class="text-xs font-bold uppercase tracking-wider text-slate-600">Tercatat Hari Ini (<span id="countToday">0</span>)</h2>
        <button onclick="loadPersonel()" class="text-[11px] text-blue-600 font-semibold">Perbarui</button>
      </div>
      <div id="todayList" class="divide-y divide-slate-100 text-xs text-slate-600">
        <p class="py-2 text-slate-400 text-center">Belum ada data absen hari ini.</p>
      </div>
    </div>
  </main>

  <footer class="text-center py-4 text-[11px] text-slate-400">
    &copy; 2026 PT Hasna Jaya Sejahtera &bull; Sistem Rekap MBU Bojong Soang
  </footer>

  <script>
    const API_URL = 'https://script.google.com/macros/s/AKfycbz5T5r0YkdpxHjZ8YbzvnmIDPXVbvwVyh_mHaCS_HzJoDqP-ZwIOkENnk0-cSkNZ-Ri/exec';

    const FALLBACK_PERSONEL = [
      { id: 1, nama: 'Ramdan Iskandar' }, { id: 2, nama: 'Much Rizki Firdaus' },
      { id: 3, nama: 'Bagas Oktaviana' }, { id: 4, nama: 'Andri' },
      { id: 5, nama: 'Chaerul Umam' }, { id: 6, nama: 'Syachrizal Fatturochman' },
      { id: 7, nama: 'Rahman Firman Syah' }, { id: 8, nama: 'Agus Nanang Koswara' },
      { id: 9, nama: 'Muhammad Fachry Airlangga' }, { id: 10, nama: 'Eef Saefulloh' },
      { id: 11, nama: 'Sahrul Ramdani' }, { id: 12, nama: 'Farel Muhamad Yasin' },
      { id: 13, nama: 'Andri Ariawan' }, { id: 14, nama: 'Fajar Aryanto' },
      { id: 15, nama: 'Anhari Agustian' }, { id: 16, nama: 'Riyad Abdul Azid' },
      { id: 17, nama: 'Fajar Mahadika' }, { id: 18, nama: 'Rama Rachmadian' },
      { id: 19, nama: 'M Mulyana S.' }, { id: 20, nama: 'Misbah Kholil Fadli' },
      { id: 21, nama: 'Muhamad Nabil Nugraha' }, { id: 22, nama: 'Farhan Achmad' },
      { id: 23, nama: 'Muhamad Azhar Assidik' }
    ];

    let personelData = [];

    function updateClock() {
      const now = new Date();
      const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
      document.getElementById('liveDate').textContent = now.toLocaleDateString('id-ID', options);
      
      const hh = String(now.getHours()).padStart(2, '0');
      const mm = String(now.getMinutes()).padStart(2, '0');
      const ss = String(now.getSeconds()).padStart(2, '0');
      document.getElementById('liveClock').textContent = `${hh}:${mm}:${ss} WIB`;

      if (!document.getElementById('toggleManualTime').checked) {
        document.getElementById('inputJam').value = `${hh}:${mm}`;
      }
    }
    setInterval(updateClock, 1000);
    updateClock();

    function toggleTimeInput() {
      const isManual = document.getElementById('toggleManualTime').checked;
      const input = document.getElementById('inputJam');
      input.readOnly = !isManual;
      if (isManual) input.focus();
    }

    function pilihShift(shiftName) {
      document.getElementById('selectedShift').value = shiftName;
      document.querySelectorAll('.shift-btn').forEach(btn => {
        btn.classList.remove('border-blue-600', 'bg-blue-50', 'text-blue-700');
        btn.classList.add('border-slate-200', 'text-slate-600');
      });
      const mapId = { 'Shift 1': 'btnShift1', 'Shift 2': 'btnShift2', 'Shift 3': 'btnShift3' };
      const activeBtn = document.getElementById(mapId[shiftName]);
      if (activeBtn) {
        activeBtn.classList.remove('border-slate-200', 'text-slate-600');
        activeBtn.classList.add('border-blue-600', 'bg-blue-50', 'text-blue-700');
      }
    }

    function getTodayISO() {
      const now = new Date();
      const y = now.getFullYear();
      const m = String(now.getMonth() + 1).padStart(2, '0');
      const d = String(now.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    async function loadPersonel() {
      const syncText = document.getElementById('syncText');
      syncText.textContent = 'Menghubungkan ke server HJS...';
      try {
        const res = await fetch(`${API_URL}?action=getAll`);
        const json = await res.json();
        if (json.status === 'ok') {
          personelData = (json.personel && json.personel.length > 0) ? json.personel : FALLBACK_PERSONEL;
          renderDropdown(personelData);
          renderTodayList(json.absensi || []);
          syncText.textContent = `Terhubung (${personelData.length} personel aktif)`;
        } else {
          throw new Error(json.message);
        }
      } catch (err) {
        personelData = FALLBACK_PERSONEL;
        renderDropdown(personelData);
        syncText.textContent = 'Mode offline cadangan (daftar lokal)';
      }
    }

    function renderDropdown(list) {
      const select = document.getElementById('selectNama');
      const currentVal = select.value;
      const sorted = [...list].sort((a, b) => String(a.nama).localeCompare(String(b.nama)));
      select.innerHTML = '<option value="">-- Pilih Nama Anda --</option>' +
        sorted.map(p => `<option value="${p.id}" data-nama="${p.nama}">${p.nama}</option>`).join('');
      if (currentVal) select.value = currentVal;
    }

    function renderTodayList(absensiList) {
      const today = getTodayISO();
      const filtered = absensiList.filter(a => String(a.tanggal).startsWith(today));
      document.getElementById('countToday').textContent = filtered.length;
      const container = document.getElementById('todayList');
      if (filtered.length === 0) {
        container.innerHTML = '<p class="py-2 text-slate-400 text-center">Belum ada yang absen hari ini.</p>';
        return;
      }
      container.innerHTML = filtered.slice().reverse().map(item => `
        <div class="py-2 flex items-center justify-between">
          <div>
            <div class="font-bold text-slate-800">${item.nama}</div>
            <div class="text-[11px] text-slate-500">${item.shift} &bull; Masuk: <b>${item.jamMasuk || '-'}</b> ${item.jamPulang ? `| Pulang: <b>${item.jamPulang}</b> (${item.durasi} jam)` : ''}</div>
          </div>
          <span class="px-2 py-0.5 rounded-full text-[10px] font-bold ${item.jamPulang ? 'bg-slate-200 text-slate-700' : 'bg-emerald-100 text-emerald-700'}">
            ${item.jamPulang ? 'Selesai' : 'Aktif'}
          </span>
        </div>
      `).join('');
    }

    function showAlert(type, msg) {
      const box = document.getElementById('alertBox');
      box.classList.remove('hidden', 'bg-emerald-50', 'border-emerald-300', 'text-emerald-800', 'bg-rose-50', 'border-rose-300', 'text-rose-800');
      if (type === 'ok') {
        box.classList.add('bg-emerald-50', 'border-emerald-300', 'text-emerald-800');
      } else {
        box.classList.add('bg-rose-50', 'border-rose-300', 'text-rose-800');
      }
      box.textContent = msg;
    }

    async function kirimAbsen(tipe) {
      const select = document.getElementById('selectNama');
      const personelId = select.value;
      const nama = select.options[select.selectedIndex]?.getAttribute('data-nama') || '';
      const shift = document.getElementById('selectedShift').value;
      const jam = document.getElementById('inputJam').value;

      if (!personelId) return showAlert('err', 'Silakan pilih nama Anda terlebih dahulu!');
      if (!shift) return showAlert('err', 'Silakan pilih Shift 1, Shift 2, atau Shift 3!');
      if (!jam) return showAlert('err', 'Jam tidak valid!');

      const btnMasuk = document.getElementById('btnMasuk');
      const btnPulang = document.getElementById('btnPulang');
      btnMasuk.disabled = true;
      btnPulang.disabled = true;
      showAlert('ok', 'Sedang mengirim data absensi...');

      try {
        const res = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({
            action: 'submitAbsen',
            data: {
              tanggal: getTodayISO(),
              personelId: personelId,
              nama: nama,
              shift: shift,
              tipe: tipe,
              jam: jam,
              durasi: 8
            }
          })
        });
        const json = await res.json();
        if (json.status === 'ok') {
          showAlert('ok', `✅ ${nama} — ${json.message} (${shift}, Pukul ${jam})`);
          loadPersonel();
        } else {
          showAlert('err', `⚠️ ${json.message}`);
        }
      } catch (err) {
        showAlert('err', 'Gagal terhubung ke server. Periksa koneksi internet Anda lalu coba lagi.');
      } finally {
        btnMasuk.disabled = false;
        btnPulang.disabled = false;
      }
    }

    loadPersonel();
  </script>
</body>
</html>
